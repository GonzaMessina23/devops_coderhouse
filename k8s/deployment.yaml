apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-login
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-login
  template:
    metadata:
      labels:
        app: devops-login
    spec:
      containers:
        - name: devops-login
          image: ghcr.io/gonzamessina23/devops_coderhouse:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: devops-login-config
            - secretRef:
                name: devops-login-secret

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
