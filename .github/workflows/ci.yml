
name: CI - Creacion Imagen Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker-build:
    name: Crear imagen docker
    runs-on: ubuntu-latest

    steps:
      - name: Subir repositorio
        uses: actions/checkout@v4

      - name: Crear imagen
        run: docker build -t devops-login-platform:latest .
